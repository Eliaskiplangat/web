<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main>
    <article class="card">
      <img
        class="card__image"
        src="./assets/images/illustration-article.svg"
        alt=""
      />

      <div class="card__content">
        <span class="card__tag">Learning</span>

        <time class="card__date" datetime="2023-12-21">Published 21 Dec 2023</time>

        <h1 class="card__title">
          <a href="#" class="card__title-link">HTML &amp; CSS foundations</a>
        </h1>

        <p class="card__description">
          These languages are the backbone of every website, defining structure, content, and presentation.
        </p>

        <div class="card__author">
          <img
            class="card__avatar"
            src="./assets/images/image-avatar.webp"
            alt=""
          />
          <span class="card__author-name">Greg Hooper</span>
        </div>
      </div>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/Eliaskiplangat/web">Elias Kiplangat</a>.
  </footer>
</body>
</html>
